<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Biomedical research intelligence for investigational drug repurposing discovery." />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Biotech Arbitrage Engine</title>
    <script>
      (function () {
        var stored = localStorage.getItem("bae-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#07070a" : "#f7f4ef");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
